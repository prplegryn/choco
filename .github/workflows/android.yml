name: Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download runtime-v1 --pattern runtime-arm64-v1.zip --dir "$RUNNER_TEMP"
          python tools/runtime_bundle.py verify "$RUNNER_TEMP/runtime-arm64-v1.zip"
      - name: Test and build
        run: |
          python tools/check_android_regex.py
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
